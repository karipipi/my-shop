<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 ｜ 櫻花喵小舖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Zen+Maru+Gothic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#f9e8ee;--pink2:#f0c6d6;--pink3:#d4829b;--pink4:#b85c78;
  --cream:#fdf8f5;--text:#3a2a30;--text2:#7a5a65;--white:#fff;--border:#edd5df;
  --green:#e8f5e9;--green2:#2e7d32;--red:#fdecea;--red2:#c62828;
  --sidebar:220px;
}
body{font-family:'Zen Maru Gothic',sans-serif;background:#f5f0f3;color:var(--text);min-height:100vh;display:flex;}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar);background:#fff;border-right:1.5px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;}
.sidebar-logo{padding:1.4rem 1.2rem;border-bottom:1px solid var(--border);font-family:'Noto Serif TC',serif;font-size:1rem;color:var(--pink4);font-weight:500;display:flex;align-items:center;gap:.5rem;}
.sidebar-logo span{font-size:1.2rem;}
.sidebar-menu{flex:1;padding:.8rem 0;overflow-y:auto;}
.menu-item{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.2rem;font-size:.85rem;color:var(--text2);cursor:pointer;border-radius:10px;margin:0 .5rem .1rem;transition:all .18s;border:none;background:none;width:calc(100% - 1rem);font-family:inherit;text-align:left;}
.menu-item:hover{background:var(--pink);color:var(--pink4);}
.menu-item.active{background:var(--pink4);color:#fff;}
.menu-item .icon{font-size:1rem;width:20px;text-align:center;}
.sidebar-footer{padding:1rem 1.2rem;border-top:1px solid var(--border);}
.back-link{display:flex;align-items:center;gap:.5rem;color:var(--text2);font-size:.82rem;text-decoration:none;padding:.5rem .7rem;border-radius:8px;transition:background .2s;}
.back-link:hover{background:var(--pink);color:var(--pink4);}

/* ── Main ── */
.main{margin-left:var(--sidebar);flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1.5px solid var(--border);padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Noto Serif TC',serif;font-size:1.05rem;color:var(--text);font-weight:500;}
.topbar-actions{display:flex;gap:.7rem;align-items:center;}
.content{padding:2rem;flex:1;}
.panel{display:none;}
.panel.active{display:block;}

/* ── Cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:1.2rem 1.4rem;}
.stat-icon{font-size:1.5rem;margin-bottom:.5rem;}
.stat-value{font-size:1.6rem;font-weight:600;color:var(--pink4);font-family:'Noto Serif TC',serif;}
.stat-label{font-size:.78rem;color:var(--text2);margin-top:.15rem;}

/* ── Buttons ── */
.btn{border:none;border-radius:10px;padding:.5rem 1.1rem;font-size:.83rem;cursor:pointer;font-family:inherit;transition:all .18s;display:inline-flex;align-items:center;gap:.4rem;}
.btn-pink{background:var(--pink4);color:#fff;}.btn-pink:hover{background:#9a4a65;}
.btn-outline{background:#fff;color:var(--pink4);border:1.5px solid var(--pink3);}.btn-outline:hover{background:var(--pink);}
.btn-red{background:var(--red);color:var(--red2);border:1px solid #f5c6c6;}.btn-red:hover{background:#f5c6c6;}
.btn-green{background:var(--green);color:var(--green2);border:1px solid #c8e6c9;}.btn-green:hover{background:#c8e6c9;}
.btn-sm{padding:.35rem .8rem;font-size:.78rem;}

/* ── Table ── */
.table-wrap{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.table-header{padding:1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.table-header h3{font-size:.92rem;font-weight:500;color:var(--text);}
table{width:100%;border-collapse:collapse;}
th{background:var(--cream);font-size:.78rem;color:var(--text2);font-weight:500;padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--border);}
td{font-size:.83rem;color:var(--text);padding:.8rem 1rem;border-bottom:1px solid #f5eef2;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fdf5f8;}
.td-img{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--pink),var(--pink2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex-shrink:0;}
.td-img img{width:100%;height:100%;object-fit:cover;}
.badge{display:inline-block;font-size:.7rem;border-radius:8px;padding:.18rem .6rem;font-weight:500;}
.badge-dress{background:#fce4ec;color:#c2185b;}
.badge-blind{background:#e8eaf6;color:#3949ab;}
.badge-acc{background:#e0f2f1;color:#00796b;}
.badge-sale{background:#fff3e0;color:#e65100;}
.featured-toggle{cursor:pointer;font-size:1.1rem;background:none;border:none;transition:transform .2s;}
.featured-toggle:hover{transform:scale(1.2);}

/* ── Modal / Drawer ── */
.drawer-backdrop{position:fixed;inset:0;background:rgba(40,15,25,.4);z-index:200;display:none;}
.drawer-backdrop.open{display:block;}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:#fff;z-index:201;transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);overflow-y:auto;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5;}
.drawer-head h2{font-size:.98rem;font-weight:500;font-family:'Noto Serif TC',serif;color:var(--pink4);}
.drawer-close{background:var(--pink);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem;color:var(--pink4);}
.drawer-body{padding:1.4rem;flex:1;}
.drawer-footer{padding:1rem 1.4rem;border-top:1px solid var(--border);display:flex;gap:.8rem;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}

/* ── Form ── */
.fg{margin-bottom:1.1rem;}
.fg label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.35rem;font-weight:500;}
.fg input,.fg textarea,.fg select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.55rem .85rem;font-size:.85rem;font-family:inherit;color:var(--text);background:var(--cream);outline:none;transition:border-color .2s;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--pink3);}
.fg textarea{resize:vertical;min-height:80px;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.fg-hint{font-size:.72rem;color:var(--text2);margin-top:.25rem;}

/* ── 圖片上傳 ── */
.img-upload-area{border:2px dashed var(--border);border-radius:12px;padding:1.2rem;text-align:center;cursor:pointer;transition:border-color .2s;background:var(--cream);}
.img-upload-area:hover{border-color:var(--pink3);}
.img-upload-area input{display:none;}
.img-upload-icon{font-size:2rem;margin-bottom:.4rem;}
.img-upload-text{font-size:.82rem;color:var(--text2);}
.img-preview-list{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem;}
.img-preview-item{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--border);background:linear-gradient(135deg,var(--pink),var(--pink2));display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.img-preview-item img{width:100%;height:100%;object-fit:cover;}
.img-preview-item .img-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.img-preview-item .img-main-badge{position:absolute;bottom:0;left:0;right:0;background:rgba(184,92,120,.85);color:#fff;font-size:.6rem;text-align:center;padding:1px;}

/* ── 規格編輯器 ── */
.spec-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.5rem;}
.spec-row{display:flex;gap:.5rem;align-items:center;}
.spec-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:.4rem .7rem;font-size:.82rem;font-family:inherit;background:var(--cream);outline:none;}
.spec-row input:focus{border-color:var(--pink3);}
.spec-del{background:var(--red);color:var(--red2);border:none;border-radius:6px;padding:.3rem .5rem;cursor:pointer;font-size:.75rem;}

/* ── Toast ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--pink4);color:#fff;padding:.65rem 1.3rem;border-radius:12px;font-size:.83rem;transform:translateY(60px);opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.green{background:var(--green2);}

/* ── Delete confirm ── */
.confirm-modal{position:fixed;inset:0;background:rgba(40,15,25,.45);z-index:300;display:none;align-items:center;justify-content:center;}
.confirm-modal.open{display:flex;}
.confirm-box{background:#fff;border-radius:16px;padding:2rem;max-width:360px;width:90%;text-align:center;}
.confirm-box h3{font-family:'Noto Serif TC',serif;color:var(--pink4);margin-bottom:.8rem;}
.confirm-box p{font-size:.88rem;color:var(--text2);margin-bottom:1.4rem;line-height:1.8;}
.confirm-actions{display:flex;gap:.8rem;justify-content:center;}

/* ── Empty ── */
.empty{text-align:center;padding:3rem;color:var(--text2);}
.empty .e-icon{font-size:2.5rem;margin-bottom:.8rem;}

@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .content{padding:1rem;}
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo"><span>🐱</span> 後台管理</div>
  <nav class="sidebar-menu">
    <button class="menu-item active" onclick="switchPanel('dashboard',this)"><span class="icon">📊</span> 總覽</button>
    <button class="menu-item" onclick="switchPanel('products',this)"><span class="icon">🛍</span> 商品管理</button>
    <button class="menu-item" onclick="switchPanel('featured',this)"><span class="icon">⭐</span> 主打商品</button>
  </nav>
  <div class="sidebar-footer">
    <a class="back-link" href="index.html" target="_blank">← 前往商店</a>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">總覽</div>
    <div class="topbar-actions">
      <span id="admin-user" style="font-size:.78rem;color:var(--text2);"></span>
      <button class="btn btn-outline btn-sm" id="logout-btn">登出</button>
      <button class="btn btn-pink" onclick="openDrawer()">＋ 新增商品</button>
    </div>
  </div>
  <div class="content">

    <!-- 總覽 -->
    <div class="panel active" id="panel-dashboard">
      <div class="stat-grid" id="stat-grid"></div>
      <div class="table-wrap">
        <div class="table-header"><h3>近期商品</h3><button class="btn btn-outline btn-sm" onclick="switchPanel('products',document.querySelector('.menu-item:nth-child(2))'))">查看全部</button></div>
        <table><thead><tr><th>商品</th><th>類別</th><th>價格</th><th>主打</th></tr></thead>
        <tbody id="dash-table"></tbody></table>
      </div>
    </div>

    <!-- 商品管理 -->
    <div class="panel" id="panel-products">
      <div class="table-wrap">
        <div class="table-header">
          <h3>全部商品 (<span id="product-count">0</span>)</h3>
          <div style="display:flex;gap:.6rem;">
            <input id="search-input" type="text" placeholder="搜尋商品…" style="border:1.5px solid var(--border);border-radius:8px;padding:.35rem .8rem;font-size:.82rem;font-family:inherit;background:var(--cream);outline:none;width:180px;" oninput="renderTable()">
          </div>
        </div>
        <table>
          <thead><tr><th>圖片</th><th>商品名稱</th><th>類別</th><th>售價</th><th>主打</th><th>操作</th></tr></thead>
          <tbody id="product-table"></tbody>
        </table>
        <div id="product-empty" class="empty" style="display:none"><div class="e-icon">🌸</div>目前沒有商品</div>
      </div>
    </div>

    <!-- 主打商品 -->
    <div class="panel" id="panel-featured">
      <div class="table-wrap">
        <div class="table-header"><h3>首頁主打商品設定</h3><p style="font-size:.78rem;color:var(--text2);">點擊星星切換是否在首頁顯示</p></div>
        <table>
          <thead><tr><th>圖片</th><th>商品名稱</th><th>類別</th><th>首頁主打</th></tr></thead>
          <tbody id="featured-table"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- 新增/編輯 Drawer -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawer-title">新增商品</h2>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <input type="hidden" id="edit-id">

    <div class="fg-row">
      <div class="fg">
        <label>商品名稱 *</label>
        <input type="text" id="f-name" placeholder="例：春日和服套裝">
      </div>
      <div class="fg">
        <label>分類 *</label>
        <select id="f-cat" onchange="handleCatChange(this)">
          <option value="dress">娃衣套裝</option>
          <option value="blind">娃娃盲盒</option>
          <option value="acc">配件飾品</option>
          <option value="sale">特價專區</option>
          <option value="__custom__">＋ 新增自訂分類…</option>
        </select>
        <div id="custom-cat-wrap" style="display:none;margin-top:.5rem;display:none;">
          <input type="text" id="f-cat-custom" placeholder="輸入新分類名稱（如：新品上市）" style="border:1.5px solid var(--border);border-radius:10px;padding:.55rem .85rem;font-size:.85rem;font-family:inherit;width:100%;background:var(--cream);outline:none;">
          <div class="fg-hint">輸入後會自動新增到分類清單</div>
        </div>
      </div>
    </div>

    <div class="fg-row">
      <div class="fg">
        <label>售價 (NT$) *</label>
        <input type="number" id="f-price" placeholder="380" min="0">
      </div>
      <div class="fg">
        <label>原價 (NT$)（選填）</label>
        <input type="number" id="f-oldprice" placeholder="留空表示無折扣" min="0">
      </div>
    </div>

    <div class="fg">
      <label>標籤文字</label>
      <input type="text" id="f-tag" placeholder="例：娃衣、新品、限定">
    </div>

    <div class="fg">
      <label>商品介紹</label>
      <textarea id="f-desc" placeholder="輸入商品詳細說明…"></textarea>
    </div>

    <!-- 圖片上傳 -->
    <div class="fg">
      <label>商品圖片（可多張，第一張為主圖）</label>
      <div class="img-upload-area" onclick="document.getElementById('img-file-input').click()">
        <input type="file" id="img-file-input" accept="image/*" multiple onchange="handleImgUpload(event)">
        <div class="img-upload-icon">📷</div>
        <div class="img-upload-text">點擊上傳圖片<br><span style="font-size:.7rem;opacity:.7;">支援 JPG、PNG、WEBP，可一次選多張</span></div>
      </div>
      <div class="img-preview-list" id="img-preview-list"></div>
    </div>

    <!-- 規格 -->
    <div class="fg">
      <label>商品規格</label>
      <div class="spec-list" id="spec-list"></div>
      <button class="btn btn-outline btn-sm" onclick="addSpec()">＋ 新增規格行</button>
      <div class="fg-hint">例：布料 / 高質感棉麻混紡</div>
    </div>

    <div class="fg">
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" id="f-featured" style="width:auto;accent-color:var(--pink4);">
        在首頁主打商品顯示
      </label>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-outline" onclick="closeDrawer()">取消</button>
    <button class="btn btn-pink" onclick="saveProduct()">儲存商品 ✓</button>
  </div>
</div>

<!-- 刪除確認 -->
<div class="confirm-modal" id="confirm-modal">
  <div class="confirm-box">
    <h3>確定要刪除？</h3>
    <p id="confirm-text">這個動作無法復原，商品將被永久刪除。</p>
    <div class="confirm-actions">
      <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
      <button class="btn btn-red" id="confirm-ok-btn">確定刪除</button>
    </div>
  </div>
</div>

<!-- 登入畫面 -->
<div id="login-screen" style="position:fixed;inset:0;background:var(--cream);z-index:999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;border:1px solid var(--border);padding:2.5rem 2rem;text-align:center;max-width:360px;width:90%;">
    <div style="font-size:2.5rem;margin-bottom:.8rem;">🐱</div>
    <div style="font-family:'Noto Serif TC',serif;font-size:1.2rem;color:var(--pink4);margin-bottom:.4rem;">櫻花喵後台管理</div>
    <div style="font-size:.83rem;color:var(--text2);margin-bottom:1.8rem;">請使用管理員帳號登入</div>
    <button id="login-btn" style="display:flex;align-items:center;gap:.8rem;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.5rem;font-size:.9rem;cursor:pointer;font-family:inherit;color:var(--text);margin:0 auto;transition:box-shadow .2s;" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,.1)'" onmouseout="this.style.boxShadow='none'">
      <img src="https://www.google.com/favicon.ico" width="18" height="18">
      使用 Google 帳號登入
    </button>
    <div id="login-error" style="color:#c62828;font-size:.78rem;margin-top:1rem;display:none;">此帳號沒有管理權限</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, setDoc, deleteDoc, doc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBo8hfvLBQ4lB5NgP_wbUP44n6U0jdC4lE",
  authDomain: "sakoraneko.firebaseapp.com",
  projectId: "sakoraneko",
  storageBucket: "sakoraneko.firebasestorage.app",
  messagingSenderId: "891521822809",
  appId: "1:891521822809:web:8de257dd40953e4b224148",
  measurementId: "G-FGY3K4XJHQ"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ADMIN_EMAILS = ["andy3031130311@gmail.com", "amnesia070504@gmail.com"];
const isAdmin = email => ADMIN_EMAILS.includes(email);

// ════════════════════════════════════════
// Google 登入
// ════════════════════════════════════════
document.getElementById('login-btn').onclick = async () => {
  try{
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    if(result.user.email && !isAdmin(result.user.email)){
      document.getElementById('login-error').style.display='block';
      await auth.signOut();
    }
  }catch(e){ console.error(e); }
};

onAuthStateChanged(auth, user => {
  if(user && isAdmin(user.email)){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('admin-user').textContent = user.displayName || user.email;
    initData();
  } else {
    document.getElementById('login-screen').style.display='flex';
  }
});

function initData(){
  const q = query(collection(db,'products'), orderBy('createdAt','asc'));
  onSnapshot(q, snapshot => {
    _products = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
    renderDashboard();
    renderTable();
    renderFeatured();
  });
}

document.getElementById('logout-btn').onclick = () => auth.signOut();

// ════════════════════════════════════════
// 自訂分類管理
// ════════════════════════════════════════
const DEFAULT_CATS = {dress:'娃衣套裝',blind:'娃娃盲盒',acc:'配件飾品',sale:'特價專區'};
const CAT_BADGE={dress:'badge-dress',blind:'badge-blind',acc:'badge-acc',sale:'badge-sale'};

function getCustomCats(){
  try{ return JSON.parse(localStorage.getItem('sakura_custom_cats')||'{}'); }catch(e){ return {}; }
}
function saveCustomCats(cats){ localStorage.setItem('sakura_custom_cats', JSON.stringify(cats)); }
function getCatLabel(cat){
  return DEFAULT_CATS[cat] || getCustomCats()[cat] || cat;
}
function getCatBadge(cat){ return CAT_BADGE[cat]||'badge-dress'; }

function buildCatSelect(){
  const sel = document.getElementById('f-cat');
  const current = sel.value;
  const customCats = getCustomCats();
  sel.innerHTML = '';
  // 預設分類
  Object.entries(DEFAULT_CATS).forEach(([v,l])=>{
    sel.innerHTML += `<option value="${v}">${l}</option>`;
  });
  // 自訂分類
  Object.entries(customCats).forEach(([v,l])=>{
    sel.innerHTML += `<option value="${v}">${l}</option>`;
  });
  sel.innerHTML += `<option value="__custom__">＋ 新增自訂分類…</option>`;
  if(current) sel.value = current;
}

function handleCatChange(sel){
  const wrap = document.getElementById('custom-cat-wrap');
  if(sel.value === '__custom__'){
    wrap.style.display = 'block';
    document.getElementById('f-cat-custom').focus();
    document.getElementById('f-cat-custom').onblur = ()=>{
      const name = document.getElementById('f-cat-custom').value.trim();
      if(name){
        const key = 'custom_' + Date.now();
        const cats = getCustomCats();
        cats[key] = name;
        saveCustomCats(cats);
        buildCatSelect();
        document.getElementById('f-cat').value = key;
        wrap.style.display = 'none';
        document.getElementById('f-cat-custom').value = '';
        // 也更新篩選tab
        buildShopFilterTabs();
      }
    };
  } else {
    wrap.style.display = 'none';
  }
}

function buildShopFilterTabs(){
  // 更新後台的分類標籤顯示（若有需要可擴充）
}

const CAT_LABEL = new Proxy({}, {
  get(_, cat){ return getCatLabel(cat); }
});
let _products = [];
function getProducts(){ return _products; }

async function saveProduct_db(product, id){
  if(id){ await setDoc(doc(db,'products',id), product); }
  else { await addDoc(collection(db,'products'), {...product, createdAt: serverTimestamp()}); }
}
async function deleteProduct_db(id){ await deleteDoc(doc(db,'products',id)); }
async function updateFeatured_db(id, featured){ await setDoc(doc(db,'products',id), {featured}, {merge:true}); }

// ════════════════════════════════════════
// 面板切換
// ════════════════════════════════════════
const panelTitles={dashboard:'總覽',products:'商品管理',featured:'主打商品設定'};
function switchPanel(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.menu-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  document.getElementById('topbar-title').textContent=panelTitles[id]||'';
  if(id==='dashboard') renderDashboard();
  if(id==='products') renderTable();
  if(id==='featured') renderFeatured();
}

// ════════════════════════════════════════
// 總覽
// ════════════════════════════════════════
function renderDashboard(){
  const products=getProducts();
  const featured=products.filter(p=>p.featured).length;
  const cats=[...new Set(products.map(p=>p.cat))].length;
  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-card"><div class="stat-icon" style="font-size:1rem;font-weight:600;color:var(--pink3);">商品</div><div class="stat-value">${products.length}</div><div class="stat-label">商品總數</div></div>
    <div class="stat-card"><div class="stat-icon" style="font-size:1rem;font-weight:600;color:var(--pink3);">主打</div><div class="stat-value">${featured}</div><div class="stat-label">主打商品</div></div>
    <div class="stat-card"><div class="stat-icon" style="font-size:1rem;font-weight:600;color:var(--pink3);">分類</div><div class="stat-value">${cats}</div><div class="stat-label">商品類別</div></div>
    <div class="stat-card"><div class="stat-icon" style="font-size:1rem;font-weight:600;color:var(--pink3);">圖片</div><div class="stat-value">${products.filter(p=>p.imgs&&p.imgs.length).length}</div><div class="stat-label">已上傳圖片</div></div>
  `;
  document.getElementById('dash-table').innerHTML=products.slice(0,6).map(p=>`
    <tr>
      <td><div style="display:flex;align-items:center;gap:.8rem;"><div class="td-img">${p.imgs&&p.imgs[0]?`<img src="${p.imgs[0]}">`:''}</div><span>${p.name}</span></div></td>
      <td><span class="badge ${getCatBadge(p.cat)}">${getCatLabel(p.cat)}</span></td>
      <td>NT$${p.price}${p.oldPrice?` <s style="color:var(--text2);font-size:.75rem;">NT$${p.oldPrice}</s>`:''}</td>
      <td>${p.featured?'✓':'—'}</td>
    </tr>`).join('');
}

// ════════════════════════════════════════
// 商品管理表格
// ════════════════════════════════════════
function renderTable(){
  const products=getProducts();
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  const filtered=q?products.filter(p=>p.name.toLowerCase().includes(q)):products;
  document.getElementById('product-count').textContent=products.length;
  const tbody=document.getElementById('product-table');
  const empty=document.getElementById('product-empty');
  if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML=filtered.map(p=>`
    <tr>
      <td><div class="td-img">${p.imgs&&p.imgs[0]?`<img src="${p.imgs[0]}">`:''}</div></td>
      <td style="max-width:200px;">${p.name}</td>
      <td><span class="badge ${getCatBadge(p.cat)}">${getCatLabel(p.cat)}</span></td>
      <td>NT$${p.price}${p.oldPrice?` <s style="color:var(--text2);font-size:.75rem;">NT$${p.oldPrice}</s>`:''}</td>
      <td><button class="featured-toggle" onclick="toggleFeatured('${p.id}')" title="${p.featured?'取消主打':'設為主打'}">${p.featured?'⭐':'☆'}</button></td>
      <td>
        <div style="display:flex;gap:.4rem;">
          <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">編輯</button>
          <button class="btn btn-red btn-sm" onclick="confirmDelete('${p.id}','${p.name.replace(/'/g,"\\'")}')">刪除</button>
        </div>
      </td>
    </tr>`).join('');
}

// ════════════════════════════════════════
// 主打設定
// ════════════════════════════════════════
function renderFeatured(){
  const products=getProducts();
  document.getElementById('featured-table').innerHTML=products.map(p=>`
    <tr>
      <td><div class="td-img">${p.imgs&&p.imgs[0]?`<img src="${p.imgs[0]}">`:''}</div></td>
      <td>${p.name}</td>
      <td><span class="badge ${getCatBadge(p.cat)}">${getCatLabel(p.cat)}</span></td>
      <td>
        <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
          <input type="checkbox" ${p.featured?'checked':''} onchange="toggleFeatured('${p.id}')" style="accent-color:var(--pink4);width:16px;height:16px;">
          <span style="font-size:.83rem;color:var(--text2);">${p.featured?'顯示中':'未顯示'}</span>
        </label>
      </td>
    </tr>`).join('');
}

// ════════════════════════════════════════
// Drawer 開關
// ════════════════════════════════════════
let editingImgs=[];

function openDrawer(reset=true){
  if(reset){
    document.getElementById('drawer-title').textContent='新增商品';
    document.getElementById('edit-id').value='';
    ['f-name','f-tag','f-desc'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-price').value='';
    document.getElementById('f-oldprice').value='';
    document.getElementById('f-featured').checked=false;
    editingImgs=[];
    renderImgPreviews();
    document.getElementById('spec-list').innerHTML='';
    addSpec();addSpec();
  }
  buildCatSelect();
  document.getElementById('drawer-backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDrawer(){
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow='';
}

function editProduct(id){
  const p=getProducts().find(x=>x.id===id);
  if(!p) return;
  document.getElementById('drawer-title').textContent='編輯商品';
  document.getElementById('edit-id').value=p.id;
  document.getElementById('f-name').value=p.name;
  document.getElementById('f-tag').value=p.tag||'';
  document.getElementById('f-cat').value=p.cat;
  document.getElementById('f-price').value=p.price;
  document.getElementById('f-oldprice').value=p.oldPrice||'';
  document.getElementById('f-desc').value=p.desc||'';
  document.getElementById('f-featured').checked=!!p.featured;
  editingImgs=[...(p.imgs||[])];
  renderImgPreviews();
  // 規格
  const specList=document.getElementById('spec-list');
  specList.innerHTML='';
  (p.specs||[]).forEach(([l,v])=>addSpec(l,v));
  if(!(p.specs&&p.specs.length)) addSpec();
  openDrawer(false);
}

// ════════════════════════════════════════
// 圖片上傳（自動壓縮）
// ════════════════════════════════════════
function handleImgUpload(e){
  const files=[...e.target.files];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      compressImage(ev.target.result, 800, 0.7, compressed=>{
        editingImgs.push(compressed);
        renderImgPreviews();
      });
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function compressImage(dataUrl, maxSize, quality, callback){
  const img=new Image();
  img.onload=()=>{
    let w=img.width, h=img.height;
    if(w>maxSize||h>maxSize){
      if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}
      else{w=Math.round(w*maxSize/h);h=maxSize;}
    }
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src=dataUrl;
}
function renderImgPreviews(){
  const list=document.getElementById('img-preview-list');
  list.innerHTML=editingImgs.map((img,i)=>`
    <div class="img-preview-item">
      <img src="${img}" alt="">
      <button class="img-del" onclick="removeImg(${i})">✕</button>
      ${i===0?'<div class="img-main-badge">主圖</div>':''}
    </div>`).join('');
}
function removeImg(i){editingImgs.splice(i,1);renderImgPreviews();}

// ════════════════════════════════════════
// 規格
// ════════════════════════════════════════
function addSpec(label='',value=''){
  const row=document.createElement('div');
  row.className='spec-row';
  row.innerHTML=`<input type="text" placeholder="項目（如：布料）" value="${label}"><input type="text" placeholder="內容（如：棉麻混紡）" value="${value}"><button class="spec-del" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('spec-list').appendChild(row);
}
function getSpecs(){
  return [...document.querySelectorAll('.spec-row')].map(row=>{
    const inputs=row.querySelectorAll('input');
    return [inputs[0].value.trim(),inputs[1].value.trim()];
  }).filter(([l,v])=>l||v);
}

// ════════════════════════════════════════
// 儲存商品
// ════════════════════════════════════════
async function saveProduct(){
  const name=document.getElementById('f-name').value.trim();
  const price=parseInt(document.getElementById('f-price').value);
  if(!name){toast('⚠ 請輸入商品名稱','error');return;}
  if(!price){toast('⚠ 請輸入售價','error');return;}

  const editId=document.getElementById('edit-id').value;
  const product={
    name,
    tag: document.getElementById('f-tag').value.trim()||getCatLabel(document.getElementById('f-cat').value)||'',
    cat: document.getElementById('f-cat').value==='__custom__'?'custom':document.getElementById('f-cat').value,
    price,
    oldPrice: parseInt(document.getElementById('f-oldprice').value)||0,
    imgs: [...editingImgs],
    desc: document.getElementById('f-desc').value.trim(),
    specs: getSpecs(),
    featured: document.getElementById('f-featured').checked,
  };

  try{
    await saveProduct_db(product, editId||null);
    closeDrawer();
    toast(editId?'✓ 商品已更新':'✓ 商品已新增');
  }catch(e){
    toast('❌ 儲存失敗：'+e.message,'error');
  }
}

// ════════════════════════════════════════
// 刪除
// ════════════════════════════════════════
let deleteTargetId='';
function confirmDelete(id,name){
  deleteTargetId=id;
  document.getElementById('confirm-text').textContent=`確定要刪除「${name}」嗎？此動作無法復原。`;
  document.getElementById('confirm-modal').classList.add('open');
  document.getElementById('confirm-ok-btn').onclick=async()=>{
    try{
      await deleteProduct_db(deleteTargetId);
      closeConfirm();
      toast('🗑 商品已刪除');
    }catch(e){toast('❌ 刪除失敗','error');}
  };
}
function closeConfirm(){document.getElementById('confirm-modal').classList.remove('open');}

async function toggleFeatured(id){
  const p=getProducts().find(x=>x.id===id);
  if(!p) return;
  try{
    await updateFeatured_db(id, !p.featured);
    toast(!p.featured?'⭐ 已加入主打商品':'已移除主打商品');
  }catch(e){toast('❌ 更新失敗','error');}
}

// ════════════════════════════════════════
// Toast
// ════════════════════════════════════════
function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show';
  t.style.background=type==='error'?'var(--red2)':'var(--pink4)';
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ════════════════════════════════════════
// 暴露全域函式
// ════════════════════════════════════════
window.switchPanel=switchPanel;
window.openDrawer=openDrawer;
window.closeDrawer=closeDrawer;
window.saveProduct=saveProduct;
window.editProduct=editProduct;
window.confirmDelete=confirmDelete;
window.closeConfirm=closeConfirm;
window.toggleFeatured=toggleFeatured;
window.addSpec=addSpec;
window.handleImgUpload=handleImgUpload;
window.removeImg=removeImg;
window.renderTable=renderTable;
window.handleCatChange=handleCatChange;
</script>
